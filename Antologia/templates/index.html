<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MACCO — Antología diaria</title>
<style>
  :root {
    --ink: #c6d0e6;
    --dim: #6c7894;
    --faint: #2b3552;
    --accent: #8fb0ff;
    --enojo: #ff3b55;
    --asco: #7fe08a;
    --miedo: #b45fd0;
    --felicidad: #ffd633;
    --tristeza: #4a8dff;
    --sorpresa: #ff9a3c;
    --neutral: #a8a8a8;
  }
  * { box-sizing: border-box; }
  html { font-size: min(0.78vw, 1.387vh); background: #000; }
  body {
    margin: 0; height: 100vh; overflow: hidden; background: #000; color: var(--ink);
    font: 1rem/1.4 "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.06em; cursor: none;
  }
  #stage {
    display: grid; grid-template-columns: 21rem 1fr 29rem;
    height: 100vh; padding: 2.4rem 2.5rem;
  }
  aside { display: flex; flex-direction: column; min-height: 0; }
  .panel { transition: opacity 1.2s ease; }
  .panel.off { opacity: 0; }

  h1 { margin: 0; font-weight: 400; font-size: 2.3rem; letter-spacing: 0.5em; color: #e8edf8;
       display: flex; align-items: center; gap: 1.2rem; }
  h1 i { display: block; width: 4.5rem; height: 1px; background: var(--dim); }
  .tag { margin: 0.2rem 0 0; color: var(--dim); font-size: 1.15rem; letter-spacing: 0.2em; }
  h2 { margin: 0 0 0.9rem; font-weight: 400; font-size: 1.05rem; letter-spacing: 0.16em; color: var(--accent); }

  #sound { margin-top: 3.4rem; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #wave { width: 100%; height: 2.2rem; flex: none; }
  .sub { margin: 1.4rem 0 0.5rem; font-size: 0.8rem; color: var(--dim); letter-spacing: 0.04em; }
  #words { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; }
  #words li { color: #77829c; font-size: 1rem; line-height: 1.55; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; transition: color 0.8s ease; }
  #words li.on { color: #fff; transition-duration: 0.15s; }
  #more { margin: 0.3rem 0 0; font-size: 0.8rem; color: var(--faint); min-height: 1.1rem; }

  #vista { flex: none; margin-top: 1rem; }
  #grid { width: 17rem; height: 14rem; display: block; }
  #coords { margin: 0.9rem 0 0; font-size: 1.05rem; color: #aeb8d0; }
  #conc { margin: 0.1rem 0 0; font-size: 1.05rem; color: var(--dim); }

  #center { position: relative; min-width: 0; }
  #vortex { position: absolute; inset: 0; width: 100%; height: 100%; }
  #phrase {
    position: absolute; left: 50%; top: 50%; width: 69%; transform: translate(-50%, -50%);
    text-align: center; opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
    padding: 4rem 3rem;
    background: radial-gradient(closest-side, rgba(0,0,0,0.88) 55%, rgba(0,0,0,0) 100%);
  }
  #phrase.on { opacity: 1; }
  #ptext { margin: 0; font-size: 2.9rem; line-height: 1.6; letter-spacing: 0.03em; color: #f2f5ff;
           font-weight: 300; text-shadow: 0 0 1.4rem #000; min-height: 4rem; }
  #pmeta { margin: 2rem 0 0; font-size: 1rem; color: var(--dim); letter-spacing: 0.18em; }
  #pmeta b { font-weight: 400; margin-right: 1.2rem; }

  #right h2 { letter-spacing: 0.14em; }
  .emo { display: grid; grid-template-columns: 1.3rem 6.6rem 1fr 3.2rem 3rem; align-items: center;
         height: 1.8rem; font-size: 1rem; }
  .emo .dot { width: 0.85rem; height: 0.85rem; border-radius: 50%; }
  .emo .track { height: 0.75rem; background: #1b2132; margin: 0 1rem; }
  .emo .fill { height: 100%; width: 0; transition: width 1.4s cubic-bezier(.2,.7,.2,1); }
  .emo .pct { text-align: right; color: #cfd6e8; }
  .emo .n { text-align: right; color: var(--dim); }

  #log { margin-top: 2.6rem; }
  #log h2 { margin-bottom: 0.4rem; }
  #logfile { margin: 0; font-size: 1rem; color: #e3e8f5; }
  #logfile span { color: var(--dim); margin-left: 0.8rem; }
  #log hr { border: 0; border-top: 1px solid var(--faint); margin: 0.9rem 0 1.1rem; }
  .row { display: grid; grid-template-columns: 11.5rem 1.4rem 1fr; font-size: 0.95rem; line-height: 1.55; color: #aeb8d0; }

  #foot { margin-top: auto; border-top: 1px solid var(--faint); padding-top: 1.7rem; display: flex; gap: 1.6rem; align-items: center; }
  #foot svg { width: 4rem; height: 2rem; flex: none; }
  #foot p { margin: 0; font-size: 0.8rem; color: var(--dim); line-height: 1.5; }
  #foot p + p { font-size: 0.95rem; letter-spacing: 0.18em; }

  @media (prefers-reduced-motion: reduce) { .panel, #phrase, .emo .fill { transition: none; } }
</style>
</head>
<body>
<div id="stage">

  <aside id="left">
    <header class="panel">
      <h1>MACCO<i></i></h1>
      <p class="tag">ANTOLOGÍA DIARIA</p>
    </header>

    <section id="sound" class="panel off">
      <h2>SONIDO / OÍDO</h2>
      <canvas id="wave"></canvas>
      <p class="sub">palabras detectadas:</p>
      <ul id="words"></ul>
      <p id="more"></p>
    </section>

    <section id="vista" class="panel off">
      <h2>VISTA / LOCALIZACIÓN</h2>
      <canvas id="grid"></canvas>
      <p id="coords"></p>
      <p id="conc"></p>
    </section>
  </aside>

  <main id="center">
    <canvas id="vortex"></canvas>
    <div id="phrase"><p id="ptext"></p><p id="pmeta"></p></div>
  </main>

  <aside id="right">
    <section id="emos" class="panel off">
      <h2>EMOCIONES ACUMULADAS (DÍA)</h2>
      <div id="emorows"></div>
    </section>

    <section id="log" class="panel off">
      <h2>LECTURA DEL LOG DIARIO</h2>
      <p id="logfile"></p>
      <hr>
      <div id="logrows"></div>
    </section>

    <footer id="foot">
      <svg viewBox="0 0 64 32" fill="none" stroke="#6c7894" stroke-width="1.4">
        <path d="M2 16h8M14 10v12M18 4v24M22 12v8M26 8v16M30 14v4M34 11v10M38 6v20M42 13v6M46 9v14M50 15v2M54 16h8"/>
      </svg>
      <div><p>MACCO · 2026</p><p>COREOGRAFÍA DE UNA SENSIBILIDAD ARTIFICIAL</p></div>
    </footer>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rnd = Math.random;
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.9;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const COLORS = { Enojo: '#ff3b55', Asco: '#7fe08a', Miedo: '#b45fd0', Felicidad: '#ffd633',
                   Tristeza: '#4a8dff', Sorpresa: '#ff9a3c', Neutral: '#a8a8a8' };
  // Orden angular del espiral (sentido horario desde arriba).
  const ORDER = ['Felicidad', 'Enojo', 'Sorpresa', 'Asco', 'Miedo', 'Tristeza', 'Neutral'];
  // Sentimiento de la frase -> color de las emociones de visión.
  const PHRASE_TINT = { Tristeza: 'Tristeza', Nostalgia: 'Tristeza', Soledad: 'Tristeza',
    Miedo: 'Miedo', Ansiedad: 'Miedo', Inquietud: 'Miedo', Deseo: 'Enojo', Rechazo: 'Enojo',
    Curiosidad: 'Sorpresa', Fascinación: 'Sorpresa', Asombro: 'Sorpresa', Ternura: 'Felicidad',
    Alivio: 'Felicidad', Calma: 'Felicidad', Esperanza: 'Felicidad', Vergüenza: 'Asco' };

  // ---------------- sprites (caracteres pre-dibujados) ----------------
  const sprites = new Map();
  const SP = Math.round(16 * DPR);
  function sprite(kind, color) {
    const key = kind + color;
    let s = sprites.get(key);
    if (s) return s;
    const u = DPR, isShape = kind === 'sq' || kind === 'ring' || kind === '+';
    const font = `${9 * u}px "DejaVu Sans Mono", monospace`;
    let w = SP;                                   // las palabras son más anchas que los símbolos
    if (!isShape) { const m = document.createElement('canvas').getContext('2d'); m.font = font; w = Math.ceil(m.measureText(kind).width) + 4 * u; }
    s = document.createElement('canvas'); s.width = w; s.height = SP;
    const g = s.getContext('2d'), c = SP / 2;
    g.strokeStyle = g.fillStyle = color; g.lineWidth = 1.3 * u;
    if (kind === 'sq') g.strokeRect(c - 4 * u, c - 4 * u, 8 * u, 8 * u);
    else if (kind === 'ring') { g.beginPath(); g.arc(c, c, 3.4 * u, 0, 7); g.stroke(); }
    else if (kind === '+') {
      g.lineWidth = 1.8 * u; g.beginPath();
      g.moveTo(c - 4 * u, c); g.lineTo(c + 4 * u, c); g.moveTo(c, c - 4 * u); g.lineTo(c, c + 4 * u); g.stroke();
    } else {
      g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(kind, w / 2, c);
    }
    sprites.set(key, s);
    return s;
  }
  // Sintaxis de SuperCollider: objetos, UGens, patrones y mensajes.
  const SMALL = ['SinOsc', 'Saw', 'Pulse', 'LFNoise0', 'LFNoise1', 'LFTri', 'Impulse', 'Dust', 'PinkNoise',
    'WhiteNoise', 'Blip', 'VarSaw', 'Gendy1', 'Klank', 'Decay2', 'EnvGen', 'Env.perc', 'Line.kr', 'XLine',
    'Lag', 'RLPF', 'LPF', 'HPF', 'BPF', 'FreeVerb', 'GVerb', 'CombN', 'AllpassN', 'Pan2', 'Mix', 'Out.ar',
    'In.ar', 'SoundIn', 'FFT', 'PV_MagFreeze', 'SynthDef', 'Synth', 'Pbind', 'Pseq', 'Prand', 'Pwhite',
    'Pdef', 'Ndef', 'Routine', 'Task', 'TempoClock', 'Demand', 'Dseq', 'TRand', 'Server', 's.boot',
    '.play', '.fork', '.ar', '.kr', '.wait', '.choose', 'rrand', 'exprand', 'freq', 'amp', 'phase', 'mul',
    'add', 'gate', 'doneAction', 'arg', 'var', 'loop', '{ }', '|a|', '~', '=>', '.do', '.scale', '.midicps'];

  // ---------------- estado ----------------
  let mode = 'idle';            // idle | visual | phrase | interlude
  let day = null;
  let parts = [];
  let path = [[50, 50]];
  let randomLoc = false;
  let heat = null, heatMax = 0;
  let t0 = performance.now(), VIS = 25;
  let fade = 0;
  let ghost = [50, 50];
  let trail = [], lastTrail = 0;

  // ---------------- visual central ----------------
  const cv = $('vortex'), cx2 = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const id of ['wave', 'grid']) {
      const c = $(id), r = c.getBoundingClientRect();
      c.width = Math.round(r.width * DPR); c.height = Math.round(r.height * DPR);
    }
    fitWords();
  }
  window.addEventListener('resize', resize);

  function build(emotions) {
    let total = emotions.reduce((a, e) => a + e.count, 0);
    const w = {};
    if (total === 0) { w.Neutral = 1; total = 1; } else emotions.forEach(e => { if (e.count) w[e.name] = e.count; });

    const sectors = []; let a = -Math.PI / 2;
    for (const name of ORDER) {
      if (!w[name]) continue;
      const span = (w[name] / total) * Math.PI * 2;
      sectors.push({ name, start: a, span, cum: 0 });
      a += span;
    }
    let acc = 0; sectors.forEach(s => { acc += s.span; s.cum = acc; });

    const N = Number(new URLSearchParams(location.search).get('n')) || 1500;
    parts = [];
    for (let i = 0; i < N; i++) {
      const pick = rnd() * acc;
      const s = sectors.find(s => pick <= s.cum) || sectors[sectors.length - 1];
      const a0 = s.start + rnd() * s.span + gauss() * 0.16;
      const r = 0.13 + 0.87 * Math.pow(rnd(), 0.72);
      const col = COLORS[s.name], q = rnd();
      let kind, color = col, sc = 1, al = 0.35 + rnd() * 0.65;
      if (q < 0.07) { kind = '+'; color = rnd() < 0.55 ? '#ffffff' : col; sc = 1.15; al = 0.9; }
      else if (q < 0.085) { kind = 'sq'; color = '#ffffff'; al = 0.85; }
      else if (q < 0.10) { kind = 'ring'; color = '#ffffff'; al = 0.85; }
      else kind = SMALL[(rnd() * SMALL.length) | 0];
      parts.push({ a0, r, spr: sprite(kind, color), sc, al,
                   w: 0.012 + 0.03 * (1 - r), ph: rnd() * 6.28, delay: rnd() * 8 });
    }
  }

  // ---------------- localización ----------------
  function makePath(locs) {
    randomLoc = !locs.length;
    if (!randomLoc) return locs;
    const p = []; let x = 25 + rnd() * 50, y = 25 + rnd() * 50;
    for (let i = 0; i < 24; i++) {
      x = clamp(x + gauss() * 14, 6, 94); y = clamp(y + gauss() * 14, 6, 94); p.push([x, y]);
    }
    return p;
  }
  const COLS = 12, ROWS = 10;
  function buildHeat(pts) {
    heat = new Float32Array(COLS * ROWS);
    for (const [x, y] of pts) {
      const gx = x / 100 * (COLS - 1), gy = y / 100 * (ROWS - 1);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const d2 = (c - gx) ** 2 + (r - gy) ** 2;
        if (d2 < 9) heat[r * COLS + c] += Math.exp(-d2 / 1.6);
      }
    }
    heatMax = Math.max(0.0001, ...heat);
    const top = heatMax / (pts.length || 1);
    $('conc').textContent = 'concentración: ' + (top > 0.55 ? 'alta' : top > 0.3 ? 'media' : 'baja')
      + (randomLoc ? '  (aleatoria)' : '');
  }
  function ramp(v) {
    if (v < 0.3) return [70, 100, 255];
    if (v < 0.55) return [175, 75, 220];
    if (v < 0.8) return [255, 140, 55];
    return [255, 232, 90];
  }
  function drawGrid() {
    const c = $('grid'), g = c.getContext('2d'), w = c.width, h = c.height;
    g.clearRect(0, 0, w, h);
    const cw = w / COLS, ch = h / ROWS;
    g.strokeStyle = 'rgba(90,110,180,0.22)'; g.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) { g.beginPath(); g.moveTo(i * cw, 0); g.lineTo(i * cw, h); g.stroke(); }
    for (let j = 0; j <= ROWS; j++) { g.beginPath(); g.moveTo(0, j * ch); g.lineTo(w, j * ch); g.stroke(); }
    if (!heat) return;
    let peak = 0, pi = 0;
    for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
      const i = r * COLS + q, v = heat[i] / heatMax;
      if (v > peak) { peak = v; pi = i; }
      if (v < 0.02) {
        if (((i * 2654435761) >>> 0) % 7 === 0) { g.fillStyle = 'rgba(80,100,220,0.28)'; g.fillRect(q * cw + cw * 0.38, r * ch + ch * 0.38, cw * 0.24, ch * 0.24); }
        continue;
      }
      const [R, G, B] = ramp(v), s = 0.25 + 0.7 * v;
      g.fillStyle = `rgba(${R},${G},${B},${0.35 + 0.65 * v})`;
      g.fillRect(q * cw + cw * (1 - s) / 2, r * ch + ch * (1 - s) / 2, cw * s, ch * s);
    }
    const pc = (pi % COLS + 0.5) * cw, pr = (Math.floor(pi / COLS) + 0.5) * ch;
    const gr = g.createRadialGradient(pc, pr, 0, pc, pr, cw * 2.4);
    gr.addColorStop(0, 'rgba(255,170,60,0.55)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    // fantasma: la posición actual
    g.strokeStyle = '#fff'; g.lineWidth = 1.5 * DPR;
    const gx = ghost[0] / 100 * (w - cw) + cw / 2, gy = ghost[1] / 100 * (h - ch) + ch / 2;
    g.strokeRect(gx - cw * 0.3, gy - ch * 0.3, cw * 0.6, ch * 0.6);
  }

  function ghostAt(te) {
    const n = path.length;
    if (n === 1) return path[0];
    const u = clamp(te / VIS, 0, 1) * (n - 1), i = Math.min(n - 2, Math.floor(u)), f = u - i, s = f * f * (3 - 2 * f);
    return [path[i][0] + (path[i + 1][0] - path[i][0]) * s, path[i][1] + (path[i + 1][1] - path[i][1]) * s];
  }

  // ---------------- paneles ----------------
  function renderPanels(d) {
    // oído
    const ul = $('words'); ul.innerHTML = '';
    (d.words.length ? d.words : ['(silencio)']).forEach(w => {
      const li = document.createElement('li'); li.textContent = d.words.length ? `"${w}"` : w; ul.appendChild(li);
    });
    // emociones
    $('emorows').innerHTML = d.emotions.map(e => `
      <div class="emo"><span class="dot" style="background:${COLORS[e.name]}"></span><span>${e.name}</span>
      <span class="track"><span class="fill" style="display:block;background:${COLORS[e.name]}" data-w="${e.pct}"></span></span>
      <span class="pct">${e.pct}%</span><span class="n">(${e.count})</span></div>`).join('');
    requestAnimationFrame(() => requestAnimationFrame(() =>
      document.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%')));
    // log
    $('logfile').innerHTML = `${d.file}<span>(${d.entries} entradas)</span>`;
    const c = d.counts, rows = [['Pensamientos', c.pensamiento], ['Oído', c.oido], ['Vista', c.vista],
                                ['Tacto', c.tacto], ['Olfato', c.olfato], ['Emociones', c.emociones]];
    $('logrows').innerHTML = rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>:</span><span>${v}</span></div>`).join('');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('off'));
    fitWords();
  }

  let hi = 0;
  function fitWords() {
    const ul = $('words'), lis = [...ul.children];
    lis.forEach(l => { l.hidden = false; l.classList.remove('on'); });
    let hidden = 0; const lim = ul.clientHeight;
    lis.forEach(l => { if (l.offsetTop + l.offsetHeight > lim + 1) { l.hidden = true; hidden++; } });
    $('more').textContent = hidden ? `+${hidden} más` : '';
  }
  setInterval(() => {
    const vis = [...$('words').children].filter(l => !l.hidden);
    if (!vis.length) return;
    vis.forEach(l => l.classList.remove('on'));
    vis[hi++ % vis.length].classList.add('on');
  }, 1100);

  // ---------------- mensajes ----------------
  let typer = null;
  function startDay(d) {
    day = d; VIS = d.visual_seconds || 25;
    path = makePath(d.locations); ghost = path[0]; trail = [];
    buildHeat(path); build(d.emotions);
    t0 = performance.now(); mode = 'visual';
    clearInterval(typer); $('phrase').classList.remove('on');
    renderPanels(d);
  }
  function showPhrase(p) {
    mode = 'phrase';
    const el = $('ptext'); el.textContent = '';
    const tint = COLORS[PHRASE_TINT[p.sentimiento]] || '#c6d0e6';
    $('pmeta').innerHTML = `<b style="color:${tint}">${p.sentimiento}</b>${p.fecha}`;
    $('phrase').classList.add('on');
    clearInterval(typer); let i = 0;
    typer = setInterval(() => { el.textContent = p.frase.slice(0, ++i); if (i >= p.frase.length) clearInterval(typer); }, 38);
  }
  function interlude() {
    mode = 'interlude';
    $('phrase').classList.remove('on');
    document.querySelectorAll('#stage .panel').forEach(p => { if (p.tagName !== 'HEADER') p.classList.add('off'); });
  }
  function onMessage(m) {
    if (m.type === 'audio') { srvLevel = m.level; lastAudio = performance.now(); }
    else if (m.type === 'day') startDay(m);
    else if (m.type === 'phrase') showPhrase(m);
    else if (m.type === 'interlude') interlude();
    else if (m.type === 'empty') {
      mode = 'idle'; $('phrase').classList.add('on');
      $('ptext').textContent = 'Sin registros todavía'; $('pmeta').textContent = m.log_dir;
    }
  }

  // ---------------- animación ----------------
  const wave = $('wave'); let last = 0;
  function drawWave(t) {
    const g = wave.getContext('2d'), w = wave.width, h = wave.height, n = 64, bw = w / n;
    g.clearRect(0, 0, w, h);
    const amp = day ? clamp(0.3 + day.words.length / 20, 0.3, 1) : 0.2;
    for (let i = 0; i < n; i++) {
      const v = Math.abs(Math.sin(i * 0.7 + t * 2.6) * Math.sin(i * 0.23 + t * 1.1)) * amp;
      const bh = Math.max(2 * DPR, v * h);
      g.fillStyle = v > 0.6 * amp ? '#c8d4f0' : '#6c7894';
      g.fillRect(i * bw + bw * 0.25, (h - bh) / 2, bw * 0.5, bh);
    }
  }

  let frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 32) return;               // ~30 fps: suficiente y ligero para Raspberry
    const dt = Math.min(0.1, (now - last) / 1000); last = now; frameN++;
    const te = (now - t0) / 1000, t = now / 1000;
    micLevel(dt);

    const target = mode === 'phrase' ? 0.22 : (mode === 'visual' ? 1 : 0);
    fade += (target - fade) * Math.min(1, dt * 2.2);

    // El fantasma recorre la ruta de localizaciones.
    ghost = ghostAt(te);
    const cx = W / 2 + (ghost[0] - 50) / 50 * W * 0.12;
    const cy = H / 2 + (ghost[1] - 50) / 50 * H * 0.10;
    const R = Math.min(W, H) * 0.44;

    cx2.clearRect(0, 0, W, H);
    if (fade > 0.01 && parts.length) {
      const h = SP / DPR, K = 3.0;
      for (const p of parts) {
        const vis = clamp((te - p.delay * 0.7) / 2.2, 0, 1);
        if (vis <= 0) continue;
        const th = p.a0 + K * (1 - p.r) + t * p.w;
        const breathe = 1 + 0.42 * (pulse - 0.33) * (0.4 + p.r);   // el borde exterior se mueve más
        const rr = p.r * (1 + 0.018 * Math.sin(t * 0.8 + p.ph)) * (0.55 + 0.45 * vis) * breathe;
        const x = cx + Math.cos(th) * rr * R, y = cy + Math.sin(th) * rr * R * 0.93;
        cx2.globalAlpha = p.al * vis * fade * (0.8 + 0.2 * Math.sin(t * 1.7 + p.ph));
        const hh = h * p.sc, ww = p.spr.width / DPR * p.sc;
        cx2.drawImage(p.spr, x - ww / 2, y - hh / 2, ww, hh);
      }
      // estela del fantasma
      if (now - lastTrail > 160) { trail.push({ x: cx, y: cy, t: now }); lastTrail = now; }
      trail = trail.filter(q => now - q.t < 7000);
      const ring = sprite('ring', '#ffffff'), plus = sprite('+', '#ffffff');
      trail.forEach((q, i) => {
        const age = (now - q.t) / 7000, s = h * (1 + age * 2.2);
        cx2.globalAlpha = (1 - age) * 0.55 * fade;
        cx2.drawImage(ring, q.x - s / 2, q.y - s / 2, s, s);
      });
      cx2.globalAlpha = 0.9 * fade;
      cx2.drawImage(plus, cx - h * 0.9, cy - h * 0.9, h * 1.8, h * 1.8);
      cx2.globalAlpha = 1;
    }

    drawWave(t);
    if (frameN % 3 === 0) {
      drawGrid();
      $('coords').textContent = day ? `x: ${Math.round(ghost[0])}  y: ${Math.round(ghost[1])}` : '';
    }
  }

  // ---------------- sonido ambiental (llega del servidor) ----------------
  // El micrófono está en la Raspberry; app.py envía {"type":"audio","level":0..1}.
  // pulse: 0 = silencio, 1 = ruido fuerte. Sin datos de audio se queda en 0.33 (tamaño normal).
  let pulse = 0.33, srvLevel = 0, lastAudio = -1e9;
  function micLevel(dt) {
    const live = performance.now() - lastAudio < 2000;
    const target = live ? 0.15 + 0.85 * srvLevel : 0.33;
    pulse += (target - pulse) * Math.min(1, dt * (target > pulse ? 12 : 3)); // sube rápido, baja lento
  }

  // ---------------- WebSocket ----------------
  let retry = 500;
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { retry = 500; setInterval(() => ws.readyState === 1 && ws.send('ping'), 25000); };
    ws.onmessage = (ev) => { if (ev.data === 'pong') return; try { onMessage(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 8000); };
  }

  resize();
  requestAnimationFrame(frame);
  connect();
})();
</script>
</body>
